name: Bicep validation
on:
  pull_request:
    paths: [deploy/bicep/**, .github/workflows/bicep.yml, .github/workflows/05-deploy-azure.yml]
  push:
    branches: [main]
    paths: [deploy/bicep/**, .github/workflows/bicep.yml, .github/workflows/05-deploy-azure.yml]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile and lint all Bicep modules
        run: |
          az bicep install
          az bicep lint --file deploy/bicep/main.bicep
          az bicep build --file deploy/bicep/main.bicep --stdout >/dev/null
