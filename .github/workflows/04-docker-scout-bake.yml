name: Build and scan
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    # Release only protected main; configure required CI/CodeQL/dependency checks.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run build && npm run test:unit

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      gateway: ${{ steps.digests.outputs.gateway }}
      worker: ${{ steps.digests.outputs.worker }}
      sandbox: ${{ steps.digests.outputs.sandbox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate release configuration
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          SCOUT_ORGANIZATION: ${{ vars.SCOUT_ORGANIZATION }}
        run: |
          [[ "$DOCKERHUB_NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]+$ ]]
          test -n "$SCOUT_ORGANIZATION"
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SECONDARY_REGISTRY=docker.io/$DOCKERHUB_NAMESPACE" >> "$GITHUB_ENV"
          echo "TAG=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        id: bake
        with:
          files: docker/docker-bake.hcl
          push: true
          provenance: mode=max
          sbom: true
      - name: Export immutable image references
        id: digests
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          for target in gateway worker sandbox-runner; do
            digest="$(jq -er --arg target "$target" '.[$target]["containerimage.digest"]' <<< "$BAKE_METADATA")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            output="$target"
            if [ "$target" = sandbox-runner ]; then output=sandbox; fi
            printf '%s=%s/%s@%s\n' "$output" "$REGISTRY" "$target" "$digest" >> "$GITHUB_OUTPUT"
          done

  scout:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, worker, sandbox]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject any fixable high or critical CVE
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves
          image: ${{ needs.publish.outputs[matrix.target] }}
          platform: ${{ matrix.platform }}
          dockerhub-user: ${{ vars.DOCKERHUB_NAMESPACE }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          write-comment: false
      - name: Enforce configured Scout organization policies
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          # Configure license, base-image and attestation policies in Scout SaaS.
          # docker/scout-policy.json describes criteria, NOT a CLI policy input.
          command: policy
          image: ${{ needs.publish.outputs[matrix.target] }}
          platform: ${{ matrix.platform }}
          organization: ${{ vars.SCOUT_ORGANIZATION }}
          dockerhub-user: ${{ vars.DOCKERHUB_NAMESPACE }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          exit-code: true
          write-comment: false

  deploy-gateway:
    needs: [publish, scout]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/05-deploy-azure.yml
    with:
      gatewayImage: ${{ needs.publish.outputs.gateway }}
      workerImage: ${{ needs.publish.outputs.worker }}
    secrets: inherit
