version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule: {interval: weekly}
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
